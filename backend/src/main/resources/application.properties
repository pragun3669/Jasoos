spring.config.import=optional:classpath:application-env.properties

# ==============================
# Application Settings
# ==============================
spring.application.name=jasoos
server.port=${PORT:8081}
server.address=0.0.0.0

# ===================================================================
# Datasource Configuration (PostgreSQL)
# ===================================================================

# --- Teacher Database ---
spring.teacher-datasource.jdbc-url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/teacherdb
spring.teacher-datasource.driver-class-name=org.postgresql.Driver
spring.teacher-datasource.username=${DB_USER}
spring.teacher-datasource.password=${DB_PASSWORD}

# --- Admin Database ---
spring.admin-datasource.jdbc-url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/admindb
spring.admin-datasource.driver-class-name=org.postgresql.Driver
spring.admin-datasource.username=${DB_USER}
spring.admin-datasource.password=${DB_PASSWORD}

# ===================================================================
# JPA & Hibernate
# ===================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================================================================
# Security (ALL secrets externalized)
# ===================================================================
jwt.secret=${JWT_SECRET}
huggingface.api.key=${HUGGINGFACE_API_KEY}
groq.api.key=${GROQ_API_KEY}

# ===================================================================
# SQL Initialization
# ===================================================================
spring.sql.init.mode=never

# ===================================================================
# Logging
# ===================================================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ===================================================================
# External Services
# ===================================================================
runner.url=${RUNNER_URL:http://localhost:5000/run}
frontend.url=${FRONTEND_URL:http://localhost:3000}
ai.base.url=${AI_BASE_URL:http://localhost:8000}
google.client.id=${GOOGLE_CLIENT_ID}