# ==============================
# Application Settings
# ==============================
spring.application.name=jasoos
server.port=8081
server.address=0.0.0.0

# ===================================================================
# Datasource Configuration (Externalized for Security)
# ===================================================================

# --- Teacher Database ---
spring.teacher-datasource.jdbc-url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/teacherdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.teacher-datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.teacher-datasource.username=${DB_USER}
spring.teacher-datasource.password=${DB_PASSWORD}

# --- Admin Database ---
spring.admin-datasource.jdbc-url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/admindb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.admin-datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.admin-datasource.username=${DB_USER}
spring.admin-datasource.password=${DB_PASSWORD}

# ===================================================================
# JPA & Hibernate
# ===================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================================================================
# Security (ALL secrets externalized)
# ===================================================================
jwt.secret=${JWT_SECRET}
huggingface.api.key=${HUGGINGFACE_API_KEY}
groq.api.key=${GROQ_API_KEY}

# ===================================================================
# SQL Initialization
# ===================================================================
spring.sql.init.mode=never

# ===================================================================
# Logging
# ===================================================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ===================================================================
# External Services
# ===================================================================
runner.url=${RUNNER_URL:http://localhost:5000/run}
